version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: smart_timetable_postgres
    environment:
      POSTGRES_USER: timetable_user
      POSTGRES_PASSWORD: timetable_password
      POSTGRES_DB: smart_timetable
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U timetable_user -d smart_timetable"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: smart_timetable_redis
    ports:
      - "6379:6379"

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: smart_timetable_backend
    environment:
      - DATABASE_URL=postgresql://timetable_user:timetable_password@postgres:5432/smart_timetable
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=super-secret-key-change-in-production-1234567890
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: smart_timetable_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
